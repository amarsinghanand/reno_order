name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile and reject merge conflicts
        run: |
          python -m compileall -q -f reno_order
          if grep -lr --exclude-dir=.git --exclude-dir=__pycache__ "^<<<<<<< " .
          then
            echo "Found merge conflict markers"
            exit 1
          fi

      - name: Ruff
        run: |
          pip install ruff
          ruff check reno_order

  tests:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', '.github/helper/install.sh') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup bench and apps
        run: bash .github/helper/install.sh

      - name: Run reno_order tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app reno_order
